name: Publish SNAPSHOT

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate SNAPSHOT version
        id: version
        run: |
          BASE_VERSION=$(grep 'VERSION_NAME' gradle.properties | cut -d= -f2 | tr -d ' ' | sed 's/-SNAPSHOT//')
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "version=${BASE_VERSION}.${COMMIT_COUNT}-build.${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Debug credentials
        run: |
          echo "NEXUS_USERNAME set: $([ -n "$NEXUS_USERNAME" ] && echo 'yes' || echo 'NO')"
          echo "NEXUS_PASSWORD set: $([ -n "$NEXUS_PASSWORD" ] && echo 'yes' || echo 'NO')"
          curl -sf -o /dev/null -w "%{http_code}" -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            "https://registry.mallne.cloud/repository/DiCentraArtefacts/cloud/mallne/units/1.0.0/units-1.0.0.module"
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Publish SNAPSHOT
        run: ./gradlew --no-daemon --info publish -PVERSION_NAME="${{ steps.version.outputs.version }}" 2>&1 | grep -i -E "(units|cloud.mallne|repository|credential|resolve)" | head -50
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
